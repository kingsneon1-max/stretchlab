<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="StretchLab: latihan peregangan pagi dan malam, panduan gerakan, timer, kalender, dan progres offline.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>StretchLab</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f30;--panel2:#1b2a40;--line:#2b3b52;--text:#edf4fc;--muted:#9cabc0;--mint:#8be0c2;--mint2:#b6f2dd;--red:#ffaaaa;--yellow:#f6d58a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172840 0,#0b1220 58%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;padding:16px 15px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px}.brand{font-size:21px;font-weight:900;letter-spacing:.4px}.brand span{color:var(--mint)}.status{font-size:11px;border:1px solid #31594e;color:var(--mint);border-radius:30px;padding:5px 9px}
h1{font-size:27px;line-height:1.2;margin:4px 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.hero,.card{border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#1e384b,#17243a);padding:20px}.row{display:flex;align-items:center;gap:11px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#1c3a38;color:var(--mint);font-size:11px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--mint);color:#10251f;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#492d39;color:#ffd7d7}.btn:disabled{opacity:.4}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#101a2af2;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.tabs button{flex:1;max-width:150px;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 2px}.tabs button b{display:block;font-size:20px;line-height:1.3}.tabs button.active{color:var(--mint)}
.progress{height:8px;background:#29384e;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--mint);border-radius:20px}
.session-card{padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--panel);margin:12px 0}.exercise{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.art{width:76px;height:76px;flex-shrink:0;border-radius:16px;background:linear-gradient(145deg,#263d56,#1a2b40);display:grid;place-items:center;overflow:hidden}.art svg{width:100%;height:100%}.exmeta{min-width:0;flex:1}.exmeta p{margin:3px 0}.check{width:21px;height:21px;accent-color:var(--mint)}
label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}input,select{width:100%;background:#0e1929;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);border-radius:14px;padding:13px}.stat strong{display:block;font-size:25px}.notice{background:#22354a;border:1px solid #344c64;padding:12px;border-radius:13px;font-size:12px;color:#d3dfed;line-height:1.55;margin:12px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calday{padding:8px 0;min-height:39px;background:var(--panel2);border-radius:9px;font-size:12px;border:1px solid transparent}.calday.done{background:#245447;color:#c8ffeb}.calday.today{border-color:var(--mint)}.barrow{display:flex;align-items:end;gap:7px;height:125px}.barcol{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:var(--mint);border-radius:6px 6px 2px 2px;min-height:4px;margin-bottom:5px}
.modal{position:fixed;inset:0;z-index:10;background:#000b;display:grid;place-items:center;padding:16px}.modalbox{width:min(100%,480px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.timer{font-size:58px;font-weight:900;text-align:center;margin:10px}.guide-art{height:190px;background:#1b2b41;border-radius:16px;display:grid;place-items:center;margin:12px 0;overflow:hidden}.guide-art svg{height:100%;max-width:100%}.steps li{margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(min-width:600px){.app{padding-top:25px}.hero{padding:24px}.art{width:88px;height:88px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">STRETCH<span>LAB</span></div><div class="status" id="offlineStatus">● MEMUAT</div></header>
<main id="view"></main>
</div>
<nav class="tabs" aria-label="Navigasi">
<button data-tab="home" class="active"><b>⌂</b>Beranda</button>
<button data-tab="plan"><b>☷</b>Jadwal</button>
<button data-tab="calendar"><b>▦</b>Kalender</button>
<button data-tab="stats"><b>↗</b>Progres</button>
<button data-tab="settings"><b>⚙</b>Pengaturan</button>
</nav>
<div id="modalRoot"></div>
<script>
'use strict';
const EXERCISES=[
{id:'neck',name:'Miringkan leher',area:'Leher',duration:30,side:true,level:'Ringan',emoji:'🧍',steps:['Duduk atau berdiri tegak dengan bahu rileks.','Miringkan telinga perlahan ke arah bahu, tanpa mengangkat bahu.','Tahan ringan, kembali ke tengah, lalu ganti sisi.'],cues:'Jangan menarik kepala dengan tangan. Hentikan bila timbul pusing, nyeri, atau kesemutan.',motion:'neck'},
{id:'shoulder',name:'Putaran bahu',area:'Bahu',duration:30,side:false,level:'Sangat ringan',emoji:'💪',steps:['Berdiri tegak dengan lengan rileks.','Angkat bahu perlahan, putar ke belakang, lalu turunkan.','Ulangi dengan gerakan kecil dan nyaman.'],cues:'Jangan memaksa rentang gerak. Bernapas normal.',motion:'shoulder'},
{id:'chest',name:'Peregangan dada di dinding',area:'Dada',duration:30,side:true,level:'Ringan',emoji:'🙆',steps:['Berdiri di samping kusen/dinding. Letakkan telapak atau lengan bawah pada permukaan setinggi bahu.','Putar badan perlahan menjauh sampai terasa regangan ringan di dada.','Tahan, kembali, lalu ganti sisi.'],cues:'Jangan memutar sampai nyeri atau memaksa bahu jauh ke belakang.',motion:'chest'},
{id:'side',name:'Peregangan sisi tubuh',area:'Sisi badan',duration:30,side:true,level:'Ringan',emoji:'↗️',steps:['Berdiri dengan kaki selebar panggul.','Angkat satu lengan dan condongkan badan perlahan ke sisi berlawanan.','Jaga kedua kaki menapak dan dada tidak diputar. Ganti sisi.'],cues:'Hindari menekuk pinggang secara berlebihan.',motion:'side'},
{id:'catcow',name:'Cat–Cow',area:'Punggung',duration:40,side:false,level:'Ringan',emoji:'🐈',steps:['Mulai posisi merangkak: tangan di bawah bahu, lutut di bawah panggul.','Buang napas sambil membulatkan punggung perlahan.','Tarik napas, kembali ke posisi netral lalu buka dada sedikit tanpa memaksa pinggang.'],cues:'Gerakkan tulang belakang dengan lembut; jangan menjatuhkan perut secara berlebihan.',motion:'catcow'},
{id:'child',name:'Child’s pose',area:'Punggung/panggul',duration:40,side:false,level:'Ringan',emoji:'🧘',steps:['Mulai berlutut di alas yang nyaman.','Geser panggul perlahan ke arah tumit dan ulurkan tangan ke depan.','Bernapas tenang; gunakan bantal jika lutut atau pinggul tidak nyaman.'],cues:'Jangan memaksa lutut atau pergelangan kaki. Boleh lakukan versi lebih tegak.',motion:'child'},
{id:'hip',name:'Hip flexor stretch',area:'Panggul depan',duration:40,side:true,level:'Ringan',emoji:'🦵',steps:['Ambil posisi setengah berlutut dengan satu kaki di depan.','Kencangkan perut ringan dan miringkan panggul sedikit ke belakang.','Geser panggul sedikit ke depan sampai terasa regangan di depan panggul kaki belakang. Ganti sisi.'],cues:'Jaga badan tegak; jangan melengkungkan pinggang untuk mencari regangan.',motion:'hip'},
{id:'ham',name:'Hamstring stretch duduk',area:'Belakang paha',duration:40,side:true,level:'Ringan',emoji:'🦿',steps:['Duduk dengan satu kaki lurus dan kaki lain ditekuk nyaman.','Condongkan badan dari panggul dengan punggung relatif netral.','Berhenti saat terasa tarikan ringan di belakang paha. Ganti sisi.'],cues:'Tidak perlu menyentuh ujung kaki. Jangan memantul atau membungkuk paksa.',motion:'ham'},
{id:'quad',name:'Quadriceps stretch',area:'Depan paha',duration:40,side:true,level:'Ringan',emoji:'🚶',steps:['Berdiri dekat dinding/kursi untuk keseimbangan.','Tekuk satu lutut dan pegang pergelangan kaki atau gunakan tali.','Dekatkan tumit ke arah bokong hanya sampai regangan ringan. Ganti sisi.'],cues:'Jaga lutut mengarah ke bawah dan berdekatan; jangan melengkungkan pinggang.',motion:'quad'},
{id:'calf',name:'Peregangan betis di dinding',area:'Betis',duration:40,side:true,level:'Ringan',emoji:'🦶',steps:['Menghadap dinding, letakkan kedua tangan di dinding.','Langkahkan satu kaki ke belakang, tumit tetap menapak dan lutut belakang lurus.','Tekuk lutut depan sedikit dan condongkan badan ke dinding. Ganti sisi.'],cues:'Tumit belakang tetap menempel lantai; jangan memaksa.',motion:'calf'},
{id:'wrist',name:'Peregangan pergelangan tangan',area:'Lengan bawah',duration:30,side:true,level:'Sangat ringan',emoji:'✋',steps:['Rentangkan satu lengan ke depan dengan siku tidak terkunci.','Dengan tangan lain, gerakkan jari perlahan ke arah bawah sampai terasa regangan ringan.','Tahan lalu lepaskan; ulangi sisi lain.'],cues:'Tarikan harus ringan. Hentikan jika ada kesemutan atau nyeri.',motion:'wrist'}
];
const DEFAULT_SETTINGS={morning:'07:00',evening:'20:00',morningIds:['neck','shoulder','chest','side','catcow'],eveningIds:['hip','ham','quad','calf','child']};
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function read(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch{return fallback}}
let settings=read('sl3_settings',DEFAULT_SETTINGS),logs=read('sl3_logs',{}),custom=read('sl3_custom',[]),tab='home',timerId=null,remaining=0,paused=false,session=[],sessionIndex=0,activeDate=today(),sessionSide=0;
function persist(){localStorage.setItem('sl3_settings',JSON.stringify(settings));localStorage.setItem('sl3_logs',JSON.stringify(logs));localStorage.setItem('sl3_custom',JSON.stringify(custom))}
function allExercises(){return [...EXERCISES,...custom]}
function getExercise(id){return allExercises().find(x=>x.id===id)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function selected(kind){const ids=kind==='Pagi'?settings.morningIds:settings.eveningIds;return ids.map(getExercise).filter(Boolean)}
function dayLog(date=today()){return logs[date]||[]}
function countToday(){return dayLog().length}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function render(){
 const v=$('view'),m=selected('Pagi'),e=selected('Malam'),n=m.length+e.length,done=countToday();
 if(tab==='home'){
  v.innerHTML=`<div class="muted small">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>Bangun lebih lentur.</h1><p class="muted">Latihan lembut, terarah, dan konsisten.</p>
  <section class="hero"><div class="row between"><div><span class="pill">PROGRAM HARI INI</span><strong style="display:block;font-size:34px;margin:8px 0 0">${done}/${n}</strong><span class="muted small">gerakan tercatat hari ini</span></div><div style="font-size:48px">🌿</div></div><div class="progress" style="margin:14px 0 7px"><i style="width:${Math.min(100,done/Math.max(1,n)*100)}%"></i></div><span class="muted small">Progres berdasarkan gerakan yang diselesaikan.</span></section>
  ${sessionCard('Pagi',settings.morning,m)}${sessionCard('Malam',settings.evening,e)}
  <div class="notice"><b>Prinsip aman:</b> regangan terasa ringan hingga sedang, bukan nyeri. Jangan memantul. Bernapas normal. Hentikan bila muncul nyeri tajam, kebas/kesemutan, pusing, atau gejala tidak biasa.</div>
  <div class="card"><h2>📚 Panduan gerakan</h2><p class="muted small">Setiap gerakan memiliki instruksi langkah demi langkah dan animasi skematis offline.</p><button class="btn secondary" onclick="setTab('plan')">Lihat panduan & jadwal</button></div>`;
 }else if(tab==='plan'){
  v.innerHTML=`<h1>Jadwal & gerakan</h1><p class="muted">Pilih gerakan untuk tiap sesi. Panduan tetap tersimpan di perangkat.</p>${planSection('Pagi',settings.morningIds)}${planSection('Malam',settings.eveningIds)}<button class="btn" onclick="openAdd()">＋ Tambah gerakan pribadi</button>`;
 }else if(tab==='calendar'){
  const d=new Date(),y=d.getFullYear(),mo=d.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();let cells=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class="muted tiny">${x}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let day=1;day<=days;day++){const key=`${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;cells+=`<button class="calday ${dayLog(key).length?'done':''} ${key===today()?'today':''}" onclick="showDay('${key}')">${day}${dayLog(key).length?' •':''}</button>`}
  const recent=Object.keys(logs).filter(k=>logs[k]?.length).sort().reverse().slice(0,10);
  v.innerHTML=`<h1>Kalender latihan</h1><p class="muted">${d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</p><div class="card"><div class="calendar">${cells}</div><p class="muted tiny">Hijau = ada gerakan selesai. Ketuk tanggal untuk detail.</p></div><h2>Riwayat terbaru</h2>${recent.length?recent.map(k=>`<div class="card row between"><div><b>${k}</b><div class="muted small">${logs[k].length} gerakan selesai</div></div><button class="btn secondary" onclick="showDay('${k}')">Lihat</button></div>`).join(''):'<div class="empty">Belum ada riwayat. Selesaikan satu sesi untuk mulai mencatat.</div>'}`;
 }else if(tab==='stats'){
  const dates=Object.keys(logs).filter(k=>logs[k]?.length),total=dates.reduce((a,k)=>a+logs[k].length,0),last=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}),weekly=last.reduce((a,k)=>a+(logs[k]?.length||0),0);
  v.innerHTML=`<h1>Progres kamu</h1><p class="muted">Pantau konsistensi, bukan mengejar angka sempurna.</p><div class="grid2"><div class="stat"><span class="muted small">Total gerakan</span><strong>${total}</strong></div><div class="stat"><span class="muted small">Hari aktif</span><strong>${dates.length}</strong></div><div class="stat"><span class="muted small">7 hari terakhir</span><strong>${weekly}</strong></div><div class="stat"><span class="muted small">Streak saat ini</span><strong>${streak()} 🔥</strong></div></div><div class="card"><h2>Aktivitas 7 hari</h2><div class="barrow">${last.map(k=>{const c=logs[k]?.length||0;return `<div class="barcol"><div class="bar" style="height:${Math.max(4,Math.min(88,c*12))}px"></div>${new Date(k+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short'})}<br>${c}</div>`}).join('')}</div></div><div class="notice">Statistik dihitung dari checklist yang diselesaikan dan disimpan pada perangkat ini. Data tidak dikirim ke server.</div>`;
 }else{
  v.innerHTML=`<h1>Pengaturan</h1><p class="muted">Atur waktu, cadangan data, dan preferensi aplikasi.</p><div class="card"><h2>Waktu latihan</h2><div class="grid2"><div><label for="morningTime">Sesi pagi</label><input type="time" id="morningTime" value="${safe(settings.morning)}"></div><div><label for="eveningTime">Sesi malam</label><input type="time" id="eveningTime" value="${safe(settings.evening)}"></div></div><button class="btn" style="margin-top:14px" onclick="saveTimes()">Simpan jadwal waktu</button><p class="muted tiny">Jam ini menjadi jadwal panduan, bukan alarm. Notifikasi terjadwal belum dijalankan karena browser membatasi alarm offline di latar belakang.</p></div><div class="card"><h2>Data pribadi</h2><div class="actions"><button class="btn secondary" onclick="exportData()">Ekspor cadangan</button><button class="btn secondary" onclick="$('importFile').click()">Impor cadangan</button></div><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><p class="muted tiny">Simpan cadangan agar riwayat tidak hilang saat data browser dibersihkan atau perangkat berganti.</p></div><div class="card"><h2>Instalasi aplikasi</h2><p class="muted small">Jika browser mendukung instalasi, tombol berikut akan muncul.</p><button id="installBtn" class="btn secondary" onclick="installApp()" disabled>Install StretchLab</button><p id="installHint" class="muted tiny">Gunakan menu Chrome → Install app jika tombol belum tersedia.</p></div><div class="card"><h2>Reset</h2><button class="btn danger" onclick="resetData()">Hapus seluruh data lokal</button></div><div class="notice">StretchLab adalah panduan kebugaran umum, bukan diagnosis atau terapi. Jika memiliki cedera, nyeri menetap, kondisi medis, sedang hamil, atau ragu terhadap gerakan, minta saran tenaga kesehatan/fisioterapis.</div>`;
 }
}
function sessionCard(kind,time,list){const seconds=list.reduce((a,x)=>a+x.duration,0);return `<section class="session-card"><div class="row between"><h2>${kind==='Pagi'?'☀️':'🌙'} Sesi ${kind.toLowerCase()}</h2><span class="pill">${safe(time)}</span></div><p class="muted small">${list.length} gerakan · sekitar ${Math.max(1,Math.ceil(seconds/60))} menit timer inti</p><button class="btn ${kind==='Malam'?'secondary':''}" onclick="startSession('${kind}')">Mulai sesi ${kind.toLowerCase()} →</button></section>`}
function planSection(kind,ids){const items=ids.map(getExercise).filter(Boolean);return `<div class="card"><div class="row between"><h2>${kind==='Pagi'?'☀️':'🌙'} Sesi ${kind}</h2><span class="pill">${items.length} gerakan</span></div>${allExercises().map(x=>`<div class="exercise"><div class="art">${art(x.motion||'basic')}</div><div class="exmeta"><b>${safe(x.name)}</b><p class="muted tiny">${safe(x.area||'Gerakan tambahan')} · ${x.duration} detik${x.side?' · bergantian sisi':''}</p><button class="btn ghost" style="padding:5px 9px;font-size:11px" onclick="showGuide('${safe(x.id)}')">Panduan</button></div><input class="check" type="checkbox" aria-label="Pilih ${safe(x.name)} untuk sesi ${kind}" ${ids.includes(x.id)?'checked':''} onchange="toggleExercise('${kind}','${safe(x.id)}',this.checked)"></div>`).join('')}</div>`}
function art(type){const head='<circle cx="100" cy="28" r="12" fill="#f3c8a6"/>';const line=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8be0c2" stroke-width="8" stroke-linecap="round"/>`;let body='';
if(type==='neck')body=`${line(100,42,100,88)}${line(100,54,65,75)}${line(100,54,135,75)}<path d="M100 44 Q82 40 83 27" fill="none" stroke="#f6d58a" stroke-width="4"/>`;
else if(type==='shoulder')body=`${line(100,42,100,92)}${line(100,54,62,70)}${line(100,54,138,70)}<path d="M52 55 Q38 72 52 88" fill="none" stroke="#f6d58a" stroke-width="4"/>`;
else if(type==='chest')body=`${line(100,42,100,91)}${line(100,54,60,42)}${line(60,42,48,15)}${line(100,54,142,42)}${line(142,42,154,15)}`;
else if(type==='side')body=`${line(100,42,100,92)}${line(100,52,72,24)}${line(72,24,66,8)}${line(100,52,135,70)}<path d="M100 45 Q80 40 72 24" fill="none" stroke="#f6d58a" stroke-width="4"/>`;
else if(type==='catcow')body=`${line(55,75,145,75)}${line(55,75,45,100)}${line(145,75,155,100)}<path d="M55 75 Q100 30 145 75" fill="none" stroke="#8be0c2" stroke-width="9"/>`;
else if(type==='child')body=`<path d="M48 82 Q72 45 108 62 L145 84 M108 62 L154 55" fill="none" stroke="#8be0c2" stroke-width="9" stroke-linecap="round"/>`;
else if(type==='hip')body=`${line(100,42,100,82)}${line(100,82,72,108)}${line(100,82,132,108)}${line(100,53,68,66)}${line(100,53,132,66)}`;
else if(type==='ham')body=`${line(95,45,95,72)}${line(95,72,52,92)}${line(95,72,145,85)}${line(95,45,125,55)}`;
else if(type==='quad')body=`${line(100,42,100,75)}${line(100,75,75,108)}${line(100,75,126,106)}<path d="M126 106 Q145 80 130 65" fill="none" stroke="#f6d58a" stroke-width="6"/>`;
else if(type==='calf')body=`${line(100,42,100,72)}${line(100,72,70,108)}${line(100,72,140,108)}<path d="M140 108 L158 108" stroke="#f6d58a" stroke-width="5"/>`;
else if(type==='wrist')body=`${line(100,42,100,78)}${line(100,55,142,55)}<path d="M142 55 L153 70" stroke="#f6d58a" stroke-width="5" fill="none"/>`;
else body=`${line(100,42,100,92)}${line(100,54,65,75)}${line(100,54,135,75)}`;
return `<svg viewBox="0 0 200 130" role="img" aria-label="Ilustrasi skematis gerakan">${head}${body}<circle cx="100" cy="115" r="3" fill="#f6d58a"/></svg>`}
function toggleExercise(kind,id,checked){const key=kind==='Pagi'?'morningIds':'eveningIds';let a=settings[key].filter(x=>x!==id);if(checked)a.push(id);settings[key]=a;persist();render()}
function startSession(kind){session=selected(kind);if(!session.length){alert('Pilih minimal satu gerakan di menu Jadwal.');return}sessionIndex=0;sessionSide=0;showExercise()}
function showExercise(){clearInterval(timerId);timerId=null;paused=false;const x=session[sessionIndex];if(!x){finishSession();return}remaining=x.duration;const sideLabel=x.side?(sessionSide===0?'Sisi pertama':'Sisi kedua'):'Gerakan utama';$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><span class="pill">GERAKAN ${sessionIndex+1}/${session.length}</span><button class="btn ghost" onclick="closeModal()">Tutup</button></div><h2 style="margin-top:12px">${safe(x.name)}</h2><div class="guide-art">${art(x.motion||'basic')}</div><div class="row between"><span class="muted small">${safe(x.area||'Peregangan')} · ${sideLabel}</span><span class="pill">${x.level||'Ringan'}</span></div><div class="timer" id="timerText">${formatTime(remaining)}</div><div class="progress"><i id="timerProgress" style="width:100%"></i></div><p class="muted small center">Ikuti instruksi. Timer berjalan otomatis.</p><div class="actions"><button id="pauseBtn" class="btn secondary" onclick="togglePause()">Jeda</button><button class="btn" onclick="completeCurrent()">Selesai / lanjut</button></div><button class="btn ghost" style="width:100%;margin-top:9px" onclick="showGuide('${safe(x.id)}')">Buka panduan lengkap</button></div></div>`;runTimer()}
function runTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(paused)return;remaining=Math.max(0,remaining-1);const el=$('timerText'),bar=$('timerProgress'),x=session[sessionIndex];if(el)el.textContent=formatTime(remaining);if(bar)bar.style.width=(remaining/Math.max(1,x.duration)*100)+'%';if(remaining<=0){clearInterval(timerId);timerId=null;const b=$('pauseBtn');if(b)b.textContent='Waktu habis';}},1000)}
function formatTime(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function togglePause(){paused=!paused;const b=$('pauseBtn');if(b)b.textContent=paused?'Lanjut':'Jeda'}
function completeCurrent(){clearInterval(timerId);timerId=null;const x=session[sessionIndex];if(x.side&&sessionSide===0){sessionSide=1;showExercise();return}const date=today();logs[date]=logs[date]||[];if(!logs[date].includes(x.id))logs[date].push(x.id);persist();sessionIndex++;sessionSide=0;if(sessionIndex<session.length)showExercise();else finishSession()}
function finishSession(){clearInterval(timerId);timerId=null;$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox center"><div style="font-size:48px">🎉</div><h2>Sesi selesai!</h2><p class="muted">Gerakan yang diselesaikan sudah dicatat pada kalender perangkat ini.</p><button class="btn" onclick="closeModal();render()">Kembali ke beranda</button></div></div>`}
function closeModal(){clearInterval(timerId);timerId=null;$('modalRoot').innerHTML=''}
function showGuide(id){const x=getExercise(id);if(!x)return;$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row between"><h2>${safe(x.name)}</h2><button class="btn ghost" onclick="closeModal()">Tutup</button></div><div class="guide-art">${art(x.motion||'basic')}</div><div class="row between"><span class="pill">${safe(x.area||'Gerakan pribadi')}</span><span class="muted small">${x.duration} detik ${x.side?'per sisi':''}</span></div><ol class="steps">${(x.steps||[x.cues||'Lakukan perlahan dalam rentang nyaman.']).map(s=>`<li>${safe(s)}</li>`).join('')}</ol><div class="notice"><b>Perhatikan:</b> ${safe(x.cues||'Lakukan perlahan dan tanpa nyeri.')}</div><button class="btn" style="width:100%" onclick="closeModal()">Mengerti</button></div></div>`}
function showDay(k){const items=dayLog(k);$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><h2>${k}</h2><button class="btn ghost" onclick="closeModal()">Tutup</button></div>${items.length?items.map(id=>`<p>✓ ${safe(getExercise(id)?.name||id)}</p>`).join(''):'<p class="muted">Belum ada gerakan tercatat.</p>'}</div></div>`}
function streak(){let n=0,d=new Date();while(true){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(dayLog(k).length){n++;d.setDate(d.getDate()-1)}else break}return n}
function saveTimes(){settings.morning=$('morningTime').value||'07:00';settings.evening=$('eveningTime').value||'20:00';persist();render();alert('Jadwal waktu tersimpan.')}
function openAdd(){$('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><h2>Tambah gerakan pribadi</h2><button class="btn ghost" onclick="closeModal()">Tutup</button></div><label>Nama gerakan</label><input id="customName" maxlength="55" placeholder="Nama gerakan"><label>Area tubuh</label><input id="customArea" maxlength="35" placeholder="Contoh: bahu"><label>Instruksi singkat</label><input id="customDesc" maxlength="180" placeholder="Cara melakukan dengan aman"><label>Durasi (detik)</label><input id="customDuration" type="number" min="10" max="180" value="30"><button class="btn" style="width:100%;margin-top:14px" onclick="addCustom()">Simpan gerakan</button><p class="muted tiny">Gerakan pribadi tidak otomatis diberi penilaian teknik. Pastikan instruksinya aman.</p></div></div>`}
function addCustom(){const name=$('customName').value.trim();if(!name){alert('Masukkan nama gerakan.');return}const desc=$('customDesc').value.trim()||'Lakukan perlahan dalam rentang nyaman.';const x={id:'custom_'+Date.now(),name,area:$('customArea').value.trim()||'Umum',duration:Math.max(10,Math.min(180,Number($('customDuration').value)||30)),side:false,level:'Pribadi',steps:[desc],cues:'Jangan memaksakan gerakan atau meneruskan jika terasa nyeri.',motion:'basic'};custom.push(x);settings.morningIds.push(x.id);persist();closeModal();render()}
function saveBlob(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){saveBlob('stretchlab-backup.json',JSON.stringify({version:3,settings,logs,custom},null,2),'application/json')}
function importData(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.logs||!Array.isArray(d.custom))throw Error();settings=d.settings;logs=d.logs;custom=d.custom;persist();alert('Cadangan berhasil diimpor.');render()}catch{alert('File cadangan tidak valid. Data tidak diubah.')}};r.readAsText(f);ev.target.value=''}
function resetData(){if(confirm('Hapus seluruh jadwal, riwayat, dan gerakan tambahan dari perangkat ini? Ekspor cadangan dahulu jika diperlukan.')){localStorage.removeItem('sl3_settings');localStorage.removeItem('sl3_logs');localStorage.removeItem('sl3_custom');settings=structuredClone(DEFAULT_SETTINGS);logs={};custom=[];persist();render()}}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=$('installBtn');if(b)b.disabled=false;const h=$('installHint');if(h)h.textContent='Aplikasi siap dipasang.'});
async function installApp(){if(!installPrompt){alert('Jika tombol belum tersedia, gunakan menu browser → Install app.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}
window.addEventListener('appinstalled',()=>{const h=$('installHint');if(h)h.textContent='StretchLab telah terpasang.'});
function updateStatus(){const s=$('offlineStatus');s.textContent=navigator.onLine?'● ONLINE / CACHE AKTIF':'● MODE OFFLINE';}
window.addEventListener('online',updateStatus);window.addEventListener('offline',updateStatus);
render();updateStatus();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(()=>{if(navigator.serviceWorker.controller)$('offlineStatus').textContent='● OFFLINE SIAP';}).catch(()=>{$('offlineStatus').textContent='● CACHE BELUM AKTIF'})}
</script>
</body></html>
