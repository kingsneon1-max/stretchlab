<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="StretchLab — jadwal peregangan pagi dan malam, timer, riwayat, dan progres.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>StretchLab</title>
<style>
:root{--bg:#0d1422;--panel:#151f30;--panel2:#1b2940;--text:#edf3fb;--muted:#9baac0;--accent:#8be0c2;--line:#29384e;--danger:#ff9b9b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101b2c,#0b1220 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:20px 16px 96px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}.brand{font-weight:850;letter-spacing:.4px;font-size:21px}.brand span{color:var(--accent)}.pill{font-size:12px;color:var(--accent);border:1px solid #376958;padding:6px 10px;border-radius:99px}
h1{font-size:27px;line-height:1.15;margin:4px 0 7px}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted)}.small{font-size:12px}.hero{background:linear-gradient(135deg,#1e3447,#17243a);border:1px solid #31465c;border-radius:22px;padding:20px;margin-bottom:18px}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.hero strong{font-size:30px;display:block;margin:8px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.btn{border:0;background:var(--accent);color:#10251f;font-weight:750;border-radius:13px;padding:12px 16px;font-size:14px;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#482c37;color:#ffd5d5}.btn:disabled{opacity:.45}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101a2aee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.tabs button{flex:1;max-width:150px;background:none;border:0;color:var(--muted);padding:8px 4px;font-size:11px;cursor:pointer}.tabs button b{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--accent)}.exercise{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.art{width:74px;height:74px;flex-shrink:0;border-radius:15px;background:#20334a;display:grid;place-items:center;font-size:34px}.tag{font-size:11px;color:var(--accent);background:#1b3a37;padding:4px 8px;border-radius:99px;display:inline-block}.progress{height:8px;background:#29384e;border-radius:20px;overflow:hidden}.progress i{height:100%;display:block;background:var(--accent);border-radius:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--panel2);padding:14px;border-radius:15px}.stat strong{font-size:24px;display:block}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:9px 0;border-radius:10px;background:var(--panel2);font-size:12px;min-height:38px}.day.done{background:#245447;color:#b8ffe9}.day.today{outline:1px solid var(--accent)}input,select{width:100%;background:#0f1a2a;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.check{accent-color:#8be0c2;width:19px;height:19px}.timer{font-size:56px;font-weight:800;text-align:center;letter-spacing:1px;margin:15px 0}.center{text-align:center}.hidden{display:none!important}.notice{padding:12px;background:#233448;border-radius:12px;color:#cbd8e8;font-size:12px;line-height:1.5}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.app{padding-top:30px}.hero{padding:25px}.art{width:86px;height:86px}}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div class="brand">STRETCH<span>LAB</span></div><div class="pill">● OFFLINE READY</div></header>
 <main id="view"></main>
</div>
<nav class="tabs">
 <button data-tab="home" class="active"><b>⌂</b>Beranda</button>
 <button data-tab="plan"><b>☷</b>Jadwal</button>
 <button data-tab="calendar"><b>▦</b>Kalender</button>
 <button data-tab="stats"><b>↗</b>Progres</button>
 <button data-tab="settings"><b>⚙</b>Pengaturan</button>
</nav>
<div id="modalRoot"></div>
<script>
const DEFAULTS=[
 {id:'neck',name:'Peregangan leher',desc:'Miringkan kepala perlahan ke kanan dan kiri, tanpa menarik paksa.',time:20,reps:'20 detik tiap sisi',emoji:'🧍',type:'Pagi'},
 {id:'shoulder',name:'Putaran bahu',desc:'Putar bahu ke belakang perlahan dengan rentang nyaman.',time:30,reps:'10 putaran',emoji:'💪',type:'Pagi'},
 {id:'side',name:'Standing side stretch',desc:'Angkat satu lengan dan condongkan badan ke sisi berlawanan.',time:30,reps:'30 detik tiap sisi',emoji:'🙆',type:'Pagi'},
 {id:'cat',name:'Cat–Cow',desc:'Posisi merangkak; lengkungkan dan netralkan punggung secara perlahan.',time:40,reps:'8–10 repetisi',emoji:'🐈',type:'Pagi'},
 {id:'hip',name:'Hip flexor stretch',desc:'Posisi lunge rendah; dorong panggul sedikit ke depan tanpa melengkungkan pinggang.',time:30,reps:'30 detik tiap sisi',emoji:'🧘',type:'Malam'},
 {id:'ham',name:'Hamstring stretch',desc:'Luruskan satu kaki dan condongkan badan dari panggul, punggung netral.',time:30,reps:'30 detik tiap sisi',emoji:'🦵',type:'Malam'},
 {id:'quad',name:'Quadriceps stretch',desc:'Berdiri sambil memegang pergelangan kaki; lutut berdekatan dan badan tegak.',time:30,reps:'30 detik tiap sisi',emoji:'🚶',type:'Malam'},
 {id:'child',name:'Child’s pose',desc:'Duduk ke arah tumit dan ulurkan tangan ke depan, bernapas santai.',time:45,reps:'45 detik',emoji:'🌙',type:'Malam'}
];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let settings=get('sl_settings',{morning:'07:00',evening:'20:00',morningIds:['neck','shoulder','side','cat'],eveningIds:['hip','ham','quad','child']});
let logs=get('sl_logs',{}),custom=get('sl_custom',[]),tab='home',timer=null,remaining=0,currentList=[],currentIndex=0;
const all=()=>[...DEFAULTS,...custom], today=()=>new Date().toISOString().slice(0,10);
const save=()=>{localStorage.setItem('sl_settings',JSON.stringify(settings));localStorage.setItem('sl_logs',JSON.stringify(logs));localStorage.setItem('sl_custom',JSON.stringify(custom))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function selected(type){let ids=type==='Pagi'?settings.morningIds:settings.eveningIds;return all().filter(x=>ids.includes(x.id))}
function doneCount(date=today()){return (logs[date]||[]).length}
function render(){
 const v=document.getElementById('view');
 if(tab==='home'){
  const d=new Date(),day=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  const m=selected('Pagi'),e=selected('Malam'),done=doneCount();
  v.innerHTML=`<div class="muted small">${day}</div><h1>Bangun lebih lentur.</h1><p class="muted">Latihan kecil yang konsisten, dilakukan dengan nyaman.</p>
  <section class="hero"><div class="hero-row"><div><span class="tag">PROGRAM HARI INI</span><strong>${done}/${m.length+e.length}</strong><span class="muted small">gerakan selesai hari ini</span></div><div style="font-size:48px">🌿</div></div><div class="progress" style="margin:15px 0 8px"><i style="width:${Math.min(100,done/Math.max(1,m.length+e.length)*100)}%"></i></div><span class="muted small">Selesaikan sesuai kemampuan, bukan kecepatan.</span></section>
  <div class="card"><div class="row between"><h2>☀️ Sesi pagi</h2><span class="tag">${settings.morning}</span></div><p class="muted small">${m.length} gerakan · sekitar ${Math.ceil(m.reduce((a,x)=>a+x.time,0)/60)} menit</p><button class="btn" onclick="startSession('Pagi')">Mulai sesi pagi →</button></div>
  <div class="card"><div class="row between"><h2>🌙 Sesi malam</h2><span class="tag">${settings.evening}</span></div><p class="muted small">${e.length} gerakan · sekitar ${Math.ceil(e.reduce((a,x)=>a+x.time,0)/60)} menit</p><button class="btn secondary" onclick="startSession('Malam')">Mulai sesi malam →</button></div>
  <div class="notice">Tips: lakukan peregangan perlahan, bernapas normal, dan berhenti jika terasa nyeri tajam, kesemutan, atau pusing.</div>`;
 }else if(tab==='plan'){
  v.innerHTML=`<h1>Jadwal latihan</h1><p class="muted">Atur gerakan yang masuk ke sesi pagi dan malam.</p>${planBlock('Pagi',settings.morningIds)}${planBlock('Malam',settings.eveningIds)}<button class="btn" onclick="openAdd()">＋ Tambah gerakan sendiri</button>`;
 }else if(tab==='calendar'){
  const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
  let cells=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class="muted small">${x}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let n=1;n<=days;n++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells+=`<div class="day ${doneCount(key)?'done':''} ${key===today()?'today':''}" onclick="showDay('${key}')">${n}${doneCount(key)?'<br>•':''}</div>`}
  const recent=Object.keys(logs).sort().reverse().slice(0,8);
  v.innerHTML=`<h1>Kalender</h1><p class="muted">${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</p><div class="card"><div class="daygrid">${cells}</div><p class="muted small">Hijau = ada latihan tercatat. Pilih tanggal untuk melihat riwayat.</p></div><h2>Riwayat terbaru</h2>${recent.length?recent.map(k=>`<div class="card row between"><div><b>${k}</b><div class="muted small">${logs[k].length} gerakan selesai</div></div><button class="btn secondary" onclick="showDay('${k}')">Lihat</button></div>`).join(''):'<p class="muted">Belum ada riwayat. Selesaikan sesi pertama untuk mulai mencatat.</p>'}`;
 }else if(tab==='stats'){
  const dates=Object.keys(logs),total=dates.reduce((a,k)=>a+logs[k].length,0),streak=calcStreak();
  const last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),count=last7.reduce((a,k)=>a+(logs[k]?.length||0),0);
  v.innerHTML=`<h1>Progres kamu</h1><p class="muted">Konsistensi lebih penting daripada intensitas.</p><div class="grid"><div class="stat"><span class="muted small">Total gerakan</span><strong>${total}</strong></div><div class="stat"><span class="muted small">Hari aktif</span><strong>${dates.length}</strong></div><div class="stat"><span class="muted small">7 hari terakhir</span><strong>${count}</strong></div><div class="stat"><span class="muted small">Rangkaian hari</span><strong>${streak} 🔥</strong></div></div><div class="card"><h2>Aktivitas 7 hari</h2><div class="row" style="align-items:end;height:125px;gap:8px">${last7.map(k=>{let n=logs[k]?.length||0;return `<div class="grow center"><div style="height:${Math.max(5,Math.min(90,n*12))}px;background:#8be0c2;border-radius:7px 7px 2px 2px"></div><div class="muted small">${new Date(k+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short'})}</div><div class="small">${n}</div></div>`}).join('')}</div></div><div class="notice">Statistik dihitung dari checklist gerakan yang kamu tandai selesai di perangkat ini.</div>`;
 }else if(tab==='settings'){
  v.innerHTML=`<h1>Pengaturan</h1><p class="muted">Personalisasi waktu latihan dan data.</p><div class="card"><h2>Waktu pengingat pilihan</h2><div class="fieldrow"><div><label>Sesi pagi</label><input type="time" id="morningTime" value="${settings.morning}"></div><div><label>Sesi malam</label><input type="time" id="eveningTime" value="${settings.evening}"></div></div><button class="btn" style="margin-top:14px" onclick="saveTimes()">Simpan waktu</button><p class="muted small">Waktu ini ditampilkan sebagai jadwal. Notifikasi terjadwal memerlukan dukungan browser dan izin khusus.</p></div><div class="card"><h2>Data aplikasi</h2><p class="muted small">Data tersimpan di browser/perangkat ini.</p><button class="btn secondary" onclick="exportData()">Ekspor cadangan</button> <button class="btn danger" onclick="resetData()">Hapus semua data</button></div><div class="notice">StretchLab bukan alat diagnosis atau terapi. Jika memiliki cedera atau kondisi medis, mintalah saran tenaga kesehatan sebelum memulai program.</div>`;
 }
}
function planBlock(type,ids){let time=type==='Pagi'?settings.morning:settings.evening;return `<div class="card"><div class="row between"><h2>${type==='Pagi'?'☀️':'🌙'} Sesi ${type}</h2><span class="tag">${time}</span></div>${all().map(x=>`<label class="row" style="font-size:14px;color:var(--text);margin:12px 0"><input class="check" type="checkbox" ${ids.includes(x.id)?'checked':''} onchange="togglePlan('${type}','${x.id}',this.checked)"><span class="grow">${esc(x.name)}<div class="muted small">${x.reps}</div></span><button class="btn ghost" onclick="event.preventDefault();showGuide('${x.id}')">Info</button></label>`).join('')}</div>`}
function togglePlan(type,id,on){let k=type==='Pagi'?'morningIds':'eveningIds';settings[k]=on?[...settings[k],id]:settings[k].filter(x=>x!==id);save();render()}
function startSession(type){currentList=selected(type);currentIndex=0;if(!currentList.length){alert('Pilih setidaknya satu gerakan di menu Jadwal.');return}showExercise()}
function showExercise(){
 clearInterval(timer);let x=currentList[currentIndex];remaining=x.time;
 document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><span class="tag">GERAKAN ${currentIndex+1}/${currentList.length}</span><button class="btn ghost" onclick="closeModal()">Tutup</button></div><div class="center" style="font-size:58px;margin:15px">${x.emoji}</div><h2 class="center">${esc(x.name)}</h2><p class="muted center">${esc(x.desc)}</p><div class="timer" id="timerText">${fmt(remaining)}</div><p class="muted center small">${esc(x.reps)}</p><div class="row"><button class="btn secondary grow" onclick="pauseTimer()" id="pauseBtn">Jeda</button><button class="btn grow" onclick="finishExercise()">Selesai ✓</button></div><p class="muted small center">Timer mulai otomatis. Kamu boleh berhenti kapan saja.</p></div></div>`;
 timer=setInterval(()=>{remaining--;let el=document.getElementById('timerText');if(el)el.textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timer);document.getElementById('pauseBtn').textContent='Waktu habis';}},1000);
}
function fmt(n){return `00:${String(n).padStart(2,'0')}`}
function pauseTimer(){if(timer){clearInterval(timer);timer=null;document.getElementById('pauseBtn').textContent='Lanjut';}else{timer=setInterval(()=>{remaining--;document.getElementById('timerText').textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timer);timer=null}},1000);document.getElementById('pauseBtn').textContent='Jeda'}}
function finishExercise(){clearInterval(timer);timer=null;let x=currentList[currentIndex],key=today();logs[key]=logs[key]||[];if(!logs[key].includes(x.id))logs[key].push(x.id);save();currentIndex++;if(currentIndex<currentList.length)showExercise();else{document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox center"><div style="font-size:54px">🎉</div><h2>Sesi selesai!</h2><p class="muted">Bagus! Catatan latihanmu sudah disimpan di perangkat ini.</p><button class="btn" onclick="closeModal();render()">Kembali ke beranda</button></div></div>`}}
function closeModal(){clearInterval(timer);timer=null;document.getElementById('modalRoot').innerHTML=''}
function showGuide(id){let x=all().find(a=>a.id===id);document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row between"><h2>${esc(x.name)}</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="center" style="font-size:65px;padding:10px">${x.emoji}</div><p>${esc(x.desc)}</p><span class="tag">${x.time} detik</span><p class="muted small">${esc(x.reps)}</p><button class="btn" onclick="closeModal()">Mengerti</button></div></div>`}
function showDay(k){let items=logs[k]||[];let names=items.map(id=>all().find(x=>x.id===id)?.name||id);document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><h2>${k}</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>${names.length?names.map(n=>`<p>✓ ${esc(n)}</p>`).join(''):'<p class="muted">Belum ada latihan tercatat.</p>'}</div></div>`}
function calcStreak(){let n=0,d=new Date();while(true){let k=d.toISOString().slice(0,10);if(doneCount(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function saveTimes(){settings.morning=document.getElementById('morningTime').value;settings.evening=document.getElementById('eveningTime').value;save();render();alert('Waktu berhasil disimpan.')}
function openAdd(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="row between"><h2>Tambah gerakan</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><label>Nama gerakan</label><input id="newName" placeholder="Contoh: Chest opener"><label>Deskripsi/panduan</label><input id="newDesc" placeholder="Cara melakukan gerakan"><div class="fieldrow"><div><label>Durasi (detik)</label><input id="newTime" type="number" value="30" min="5" max="300"></div><div><label>Ikon/emoji</label><input id="newEmoji" value="🧘"></div></div><label>Repetisi</label><input id="newReps" value="30 detik"><button class="btn" style="margin-top:15px" onclick="addExercise()">Simpan gerakan</button></div></div>`}
function addExercise(){let name=document.getElementById('newName').value.trim();if(!name){alert('Isi nama gerakan.');return}let x={id:'custom_'+Date.now(),name,desc:document.getElementById('newDesc').value.trim()||'Lakukan perlahan dalam rentang nyaman.',time:Math.max(5,Math.min(300,+document.getElementById('newTime').value||30)),emoji:document.getElementById('newEmoji').value||'🧘',reps:document.getElementById('newReps').value||'30 detik'};custom.push(x);settings.morningIds.push(x.id);save();closeModal();render()}
function exportData(){let data={settings,logs,custom};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='stretchlab-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Hapus seluruh jadwal, gerakan tambahan, dan riwayat?')){localStorage.clear();settings={morning:'07:00',evening:'20:00',morningIds:['neck','shoulder','side','cat'],eveningIds:['hip','ham','quad','child']};logs={};custom=[];save();render()}}
function render(){document.getElementById('view').innerHTML='';const old=window.__render;window.__render=old;renderView()}
function renderView(){const v=document.getElementById('view');if(tab==='home'){const d=new Date(),m=selected('Pagi'),e=selected('Malam'),done=doneCount();v.innerHTML=`<div class="muted small">${d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Bangun lebih lentur.</h1><p class="muted">Latihan kecil yang konsisten, dilakukan dengan nyaman.</p><section class="hero"><div class="hero-row"><div><span class="tag">PROGRAM HARI INI</span><strong>${done}/${m.length+e.length}</strong><span class="muted small">gerakan selesai hari ini</span></div><div style="font-size:48px">🌿</div></div><div class="progress" style="margin:15px 0 8px"><i style="width:${Math.min(100,done/Math.max(1,m.length+e.length)*100)}%"></i></div></section><div class="card"><div class="row between"><h2>☀️ Sesi pagi</h2><span class="tag">${settings.morning}</span></div><p class="muted small">${m.length} gerakan · sekitar ${Math.ceil(m.reduce((a,x)=>a+x.time,0)/60)} menit</p><button class="btn" onclick="startSession('Pagi')">Mulai sesi pagi →</button></div><div class="card"><div class="row between"><h2>🌙 Sesi malam</h2><span class="tag">${settings.evening}</span></div><p class="muted small">${e.length} gerakan · sekitar ${Math.ceil(e.reduce((a,x)=>a+x.time,0)/60)} menit</p><button class="btn secondary" onclick="startSession('Malam')">Mulai sesi malam →</button></div><div class="notice">Lakukan perlahan. Hentikan jika terasa nyeri tajam, kesemutan, atau pusing.</div>`}
else if(tab==='plan'){v.innerHTML=`<h1>Jadwal latihan</h1><p class="muted">Pilih gerakan untuk setiap sesi.</p>${planBlock('Pagi',settings.morningIds)}${planBlock('Malam',settings.eveningIds)}<button class="btn" onclick="openAdd()">＋ Tambah gerakan sendiri</button>`}
else if(tab==='calendar'){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),cells=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class="muted small">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let k=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells+=`<div class="day ${doneCount(k)?'done':''} ${k===today()?'today':''}" onclick="showDay('${k}')">${n}${doneCount(k)?'<br>•':''}</div>`}let recent=Object.keys(logs).sort().reverse().slice(0,8);v.innerHTML=`<h1>Kalender</h1><p class="muted">${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</p><div class="card"><div class="daygrid">${cells}</div><p class="muted small">Hijau = ada latihan tercatat. Pilih tanggal untuk melihat.</p></div><h2>Riwayat terbaru</h2>${recent.length?recent.map(k=>`<div class="card row between"><div><b>${k}</b><div class="muted small">${logs[k].length} gerakan selesai</div></div><button class="btn secondary" onclick="showDay('${k}')">Lihat</button></div>`).join(''):'<p class="muted">Belum ada riwayat latihan.</p>'}`}
else if(tab==='stats'){let dates=Object.keys(logs),total=dates.reduce((a,k)=>a+logs[k].length,0),last=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),count=last.reduce((a,k)=>a+(logs[k]?.length||0),0);v.innerHTML=`<h1>Progres kamu</h1><p class="muted">Konsistensi lebih penting daripada intensitas.</p><div class="grid"><div class="stat"><span class="muted small">Total gerakan</span><strong>${total}</strong></div><div class="stat"><span class="muted small">Hari aktif</span><strong>${dates.length}</strong></div><div class="stat"><span class="muted small">7 hari terakhir</span><strong>${count}</strong></div><div class="stat"><span class="muted small">Hari beruntun</span><strong>${calcStreak()} 🔥</strong></div></div><div class="card"><h2>Aktivitas 7 hari</h2><div class="row" style="align-items:end;height:125px;gap:8px">${last.map(k=>{let n=logs[k]?.length||0;return `<div class="grow center"><div style="height:${Math.max(5,Math.min(90,n*12))}px;background:#8be0c2;border-radius:7px 7px 2px 2px"></div><div class="muted small">${new Date(k+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short'})}</div><div class="small">${n}</div></div>`}).join('')}</div></div>`}
else{v.innerHTML=`<h1>Pengaturan</h1><p class="muted">Atur waktu dan kelola data.</p><div class="card"><h2>Waktu sesi</h2><div class="fieldrow"><div><label>Pagi</label><input type="time" id="morningTime" value="${settings.morning}"></div><div><label>Malam</label><input type="time" id="eveningTime" value="${settings.evening}"></div></div><button class="btn" style="margin-top:14px" onclick="saveTimes()">Simpan waktu</button><p class="muted small">Waktu ini menjadi panduan jadwal; notifikasi otomatis belum diaktifkan.</p></div><div class="card"><h2>Data aplikasi</h2><button class="btn secondary" onclick="exportData()">Ekspor cadangan</button> <button class="btn danger" onclick="resetData()">Hapus semua data</button></div><div class="notice">StretchLab bukan alat diagnosis atau terapi. Jika memiliki cedera/kondisi medis, konsultasikan latihan dengan tenaga kesehatan.</div>`}}
renderView();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
